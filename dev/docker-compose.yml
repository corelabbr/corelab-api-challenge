  #   ports:
  #     - "3333:3333"
  #   environment:
  #     - PORT=3333
  #     - HOST=0.0.0.0
  #     - NODE_ENV=development
  #     - APP_KEY=olgJQ1MqRQVt8QSiMY-96Mf-jSLymlU4
  #     - DRIVE_DISK=local
