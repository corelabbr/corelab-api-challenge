  #     - MYSQL_DB_NAME=corelab

  #   volumes:
  #     - ../:/app
  #     - /app/node_modules
  #   restart: unless-stopped



  corelab-backend:
    image: node:16.15.0
    container_name: corelab-backend
    working_dir: /app
    volumes:
      - ../../corelab-api-challenge:/app:z
    command: sh -c "npm install && npm run dev"
    ports:
      - "3333:3333"
    environment:
      - PORT=3333
      - HOST=0.0.0.0
      - NODE_ENV=development
      - APP_KEY=olgJQ1MqRQVt8QSiMY-96Mf-jSLymlU4
      - DRIVE_DISK=local
      - DB_CONNECTION=mysql
      - MYSQL_HOST=corelab-mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=user
      - MYSQL_PASSWORD=root
      - MYSQL_DB_NAME=corelab
    restart: unless-stopped
