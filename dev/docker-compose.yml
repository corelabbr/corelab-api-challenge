version: "3.9"

services:
  corelab-mysql:
    image: mysql:8.0
    container_name: corelab-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: corelab
      MYSQL_USER: user
      MYSQL_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ~/Docker/volumes/core/corelab-mysql:/var/lib/mysql:z


  corelab-frontend:
    image: node:16.15.0
    working_dir: /app
    volumes:
      - ../../corelab-web-challenge:/app:z
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - REACT_APP_API_URL=http://localhost:3333
    command: sh -c "npm install && npm start"


  # node-dev:
