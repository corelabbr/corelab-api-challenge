name: Backend CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  code-quality-and-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: corelab_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout Backend
        uses: actions/checkout@v4

      - name: Setup Node.js 16
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint / Code Quality
        run: |
          npm run lint || echo "Lint script not found"
          npm run format:check || echo "Format check script not found"

      - name: Run Unit Tests
        env:
          NODE_ENV: test
          DB_CONNECTION: pg
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_DATABASE: corelab_test
          APP_KEY: test-key-for-ci-pipeline-testing-only
        run: |
          npm test -- --coverage --passWithNoTests || echo "No tests found"

      - name: Upload Test Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-coverage
          path: coverage/

  build:
    runs-on: ubuntu-latest
    needs: code-quality-and-tests

    steps:
      - name: Checkout Backend
        uses: actions/checkout@v4

      - name: Setup Node.js 16
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Backend
        run: |
          npm run build || echo "No build script found"

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: dist/ # ajuste caso sua build saia em outra pasta

  pipeline-summary:
    runs-on: ubuntu-latest
    needs: [code-quality-and-tests, build]
    if: always()

    steps:
      - name: Pipeline Success
        if: ${{ needs.code-quality-and-tests.result == 'success' && needs.build.result == 'success' }}
        run: |
          echo "🎉 Backend CI/CD executado com sucesso!"
          echo "✅ Code Quality: OK"
          echo "✅ Unit Tests: OK"  
          echo "✅ Build: OK"

      - name: Pipeline Failure
        if: ${{ needs.code-quality-and-tests.result == 'failure' || needs.build.result == 'failure' }}
        run: |
          echo "❌ Backend CI/CD falhou!"
          echo "Code Quality: ${{ needs.code-quality-and-tests.result }}"
          echo "Unit Tests: ${{ needs.code-quality-and-tests.result }}"
          echo "Build: ${{ needs.build.result }}"
          exit 1
